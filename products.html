<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Kanga Custom Products</title>
  <link rel="stylesheet" href="CSS.css">
</head>
<body>
  <div data-include="header"></div>

  <!-- Small Header Navbar -->
  <nav class="sub-navbar">
    <ul>
      <li><a href="#medals">Medals</a></li>
      <li><a href="#pins">Pins</a></li>
      <li><a href="#trophies">Trophies</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main>
    <!-- Medals Section -->
    <section id="medals">
      <h3>Medals</h3>
      <div class="product-grid">
        <img src="medal1.jpg" alt="Medal 1">
        <img src="medal2.jpg" alt="Medal 2">
        <img src="medal3.jpg" alt="Medal 3">
        <img src="medal4.jpg" alt="Medal 4">
        <img src="medal5.jpg" alt="Medal 5">
        <img src="medal6.jpg" alt="Medal 6">
      </div>
      <button class="view-more-btn">View More</button>
    </section>

    <!-- Pins Section -->
    <section id="pins">
      <h3>Pins</h3>
      <div class="product-grid">
        <img src="pin1.jpg" alt="Pin 1">
        <img src="pin2.jpg" alt="Pin 2">
        <img src="pin3.jpg" alt="Pin 3">
        <img src="pin4.jpg" alt="Pin 4">
        <img src="pin5.jpg" alt="Pin 5">
        <img src="pin6.jpg" alt="Pin 6">
      </div>
      <button class="view-more-btn">View More</button>
    </section>

    <!-- Trophies Section -->
    <section id="trophies">
      <h3>Trophies</h3>
      <button class="view-more-btn">View Trophies</button>
    </section>
  </main>

  <div data-include="footer"></div>
  <script src="script.js" defer></script>
</body>
</html>
