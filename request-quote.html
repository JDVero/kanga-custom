<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quote - Kanga Custom Products</title>
  <link rel="stylesheet" href="CSS.css">
</head>
<body>
  <div data-include="header"></div>

  <!-- Main Content -->
  <main>
    <section class="request-quote">
      <h3>Tell us what you need!</h3>
      <div class="quote-form">
        <form action="https://formsubmit.co/jasonvero1998@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="New quote request - Kanga Custom Products">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="true">

          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your Email" required>

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit phone number" required>

          <label for="company">Company / Organisation</label>
          <input type="text" id="company" name="company" placeholder="Your Company or Organisation">

          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>

          <button type="submit">Submit</button>
        </form>
      </div>
    </section>

    <div class="modal" id="quote-modal" role="dialog" aria-modal="true" aria-labelledby="quote-modal-title" hidden>
      <div class="modal-content">
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
        <h2 id="quote-modal-title">Quote Sent!</h2>
        <p>Hang tight. We'll be reaching out to you shortly!</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div data-include="footer"></div>
  <script src="script.js" defer></script>
</body>
</html>
