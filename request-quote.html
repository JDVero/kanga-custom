<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quote - Kanga Custom Products</title>
  <link rel="stylesheet" href="CSS.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="logo-placeholder.png" alt="Kanga Logo">
      <span>Kanga Custom Products</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="why-choose-us.html">Why Choose Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="request-quote.html" class="quote-btn">Request a Quote</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section class="request-quote">
      <h3>Tell us what you need!</h3>
      <div class="quote-form">
        <form>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your Email" required>

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" required>

          <label for="company">Company / Organisation</label>
          <input type="text" id="company" name="company" placeholder="Your Company or Organisation">

          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>

          <button type="submit">Submit</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-left">
      <img src="logo-placeholder.png" alt="Kanga Logo">
      <p>Kanga Custom Products</p>
      <small>Kanga Custom Products provides custom medals, pins, and trophies for sporting events and achievements.</small>
    </div>
  </footer>
</body>
</html>
